<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="eyeClip">
      <path d="M256 176c-92 0-166 56-198 80 32 24 106 80 198 80s166-56 198-80c-32-24-106-80-198-80z"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- eye outline -->
  <path d="M256 176c-92 0-166 56-198 80 32 24 106 80 198 80s166-56 198-80c-32-24-106-80-198-80z"
        fill="none" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>

  <!-- iris made of a rising trend line, clipped to the eye shape -->
  <g clip-path="url(#eyeClip)">
    <circle cx="256" cy="256" r="64" fill="#ffffff"/>
    <circle cx="256" cy="256" r="64" fill="#1a1a3e" opacity="0.08"/>
    <polyline points="150,320 210,280 250,300 300,220 360,190"
              fill="none" stroke="#4c1d95" stroke-width="10"
              stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M336 176 L364 186 L354 214 Z" fill="#4c1d95"/>
  </g>

  <!-- pupil dot -->
  <circle cx="256" cy="256" r="20" fill="#1a1a3e"/>

  <!-- upper/lower lash accents -->
  <path d="M110 240c30-14 60-24 90-30" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  <path d="M402 240c-30-14-60-24-90-30" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
</svg>
